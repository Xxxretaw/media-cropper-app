<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Cropper Desktop POC</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">画幅裁切工具</div>
          <span class="topbar-tag">本地</span>
        </div>
        <div class="mode-tabs topbar-tabs">
          <button class="mode-tab active" data-mode="image" type="button">图片</button>
          <button class="mode-tab" data-mode="video" type="button">视频</button>
        </div>
        <div class="topbar-right">
          <span class="crop-dims" id="crop-dims"></span>
          <button id="update-check-button" type="button" class="update-check-button" title="检查更新">检查更新</button>
          <button id="theme-toggle" type="button" class="theme-btn" title="切换主题">☀</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="panel sidebar-panel">
          <div class="queue-head">
            <span class="queue-count" id="list-count">图片 0</span>
            <button id="clear-queue-button" type="button" class="clear-link">清空</button>
          </div>

          <div class="addbar">
            <button id="pick-input-button" type="button" class="add-button">添加图片</button>
          </div>

          <div class="thumbs" id="thumbs"></div>
        </aside>

        <section class="panel stage-panel">
          <div class="stage-status" id="media-summary"></div>
          <div class="preview-stage" id="preview-stage">
            <div class="preview-viewport" id="preview-viewport">
              <div class="preview-empty" id="preview-empty">
                <div class="drop-icon">+</div>
                <div class="drop-title" id="drop-title">拖入图片或视频</div>
                <button id="pick-input-secondary" type="button" class="pick-button">选择图片</button>
              </div>
              <div class="media-wrap hide" id="media-wrap">
                <div class="media-box" id="media-box">
                  <img id="preview-image" alt="图片预览" class="hide" />
                  <video id="preview-video" class="hide" playsinline preload="metadata"></video>
                  <div class="crop-overlay">
                    <div class="crop-box hide" id="crop-box">
                      <div class="grid"></div>
                      <div class="handle h-nw" data-handle="nw"></div>
                      <div class="handle h-ne" data-handle="ne"></div>
                      <div class="handle h-sw" data-handle="sw"></div>
                      <div class="handle h-se" data-handle="se"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="video-timeline hide" id="video-timeline">
              <button id="video-preview-toggle" type="button" class="timeline-play">▶</button>
              <input id="video-preview-seek" type="range" min="0" max="1000" step="1" value="0" />
              <span class="timeline-time" id="video-preview-time">00:00 / 00:00</span>
              <div class="video-export-range" id="video-export-range">
                <span class="timeline-mini-time" id="video-export-start-time">00:00</span>
                <div class="timeline-range-editor">
                  <div class="timeline-range-track"></div>
                  <div class="timeline-range-fill" id="video-export-fill"></div>
                  <input id="video-export-start" type="range" min="0" max="1000" step="1" value="0" />
                  <input id="video-export-end" type="range" min="0" max="1000" step="1" value="50" />
                </div>
                <span class="timeline-mini-time" id="video-export-end-time">00:05</span>
              </div>
            </div>
          </div>
        </section>

        <aside class="panel inspector-panel" id="panel-shell">
          <div class="inspector-empty">
            <div class="inspector-empty-icon">↗</div>
            <strong>选择一个素材</strong>
            <span>设置裁切、文件名称和导出选项</span>
          </div>

          <section class="inspector-section crop-settings-section">
            <div class="panel-head crop-section-head">
              <h2>裁切设置</h2>
              <button id="apply-current-to-all" type="button" class="ghost-button section-action" disabled>应用到全部</button>
            </div>
            <div class="ratios-panel" id="ratio-buttons">
              <button class="ratio-pill" data-ratio="21:9" type="button">21:9</button>
              <button class="ratio-pill" data-ratio="16:9" type="button">16:9</button>
              <button class="ratio-pill" data-ratio="4:3" type="button">4:3</button>
              <button class="ratio-pill" data-ratio="1:1" type="button">1:1</button>
              <button class="ratio-pill" data-ratio="3:4" type="button">3:4</button>
              <button class="ratio-pill active" data-ratio="9:16" type="button">9:16</button>
              <button class="ratio-pill" data-ratio="free" type="button">自由</button>
            </div>

            <label class="field field-range compact-range-field">
              <span class="label">缩放</span>
              <div class="range-row">
                <input id="scale" type="range" min="10" max="100" step="1" value="100" />
                <span class="value-chip" id="scale-value">100%</span>
              </div>
            </label>

            <details class="advanced-details">
              <summary>高级设置</summary>
              <div class="advanced-content">
                <div class="advanced-block">
                  <span class="label">自定义比例</span>
                  <div class="custom-ratio-row">
                    <input id="custom-ratio-width" type="number" min="1" step="1" placeholder="宽" />
                    <span class="ratio-separator">:</span>
                    <input id="custom-ratio-height" type="number" min="1" step="1" placeholder="高" />
                    <button id="apply-custom-ratio" type="button" class="ghost-button">应用</button>
                  </div>
                </div>

                <div class="advanced-block">
                  <span class="label">对齐方式</span>
                  <div class="anchor-grid" id="anchor-buttons">
                    <button class="anchor-btn" data-anchor="lt" type="button">↖</button>
                    <button class="anchor-btn" data-anchor="top" type="button">↑</button>
                    <button class="anchor-btn" data-anchor="rt" type="button">↗</button>
                    <button class="anchor-btn" data-anchor="left" type="button">←</button>
                    <button class="anchor-btn active" data-anchor="center" type="button">●</button>
                    <button class="anchor-btn" data-anchor="right" type="button">→</button>
                    <button class="anchor-btn" data-anchor="lb" type="button">↙</button>
                    <button class="anchor-btn" data-anchor="bottom" type="button">↓</button>
                    <button class="anchor-btn" data-anchor="rb" type="button">↘</button>
                  </div>
                </div>
              </div>
            </details>

            <select id="ratio" class="native-hidden">
              <option value="21:9">21:9</option>
              <option value="16:9">16:9</option>
              <option value="4:3">4:3</option>
              <option value="1:1">1:1</option>
              <option value="3:4">3:4</option>
              <option value="9:16" selected>9:16</option>
              <option value="free">自由</option>
              <option id="custom-ratio-option" value="custom" hidden>custom</option>
            </select>

            <select id="anchor" class="native-hidden">
              <option value="lt">左上</option>
              <option value="top">顶部</option>
              <option value="rt">右上</option>
              <option value="left">左侧</option>
              <option value="center" selected>居中</option>
              <option value="right">右侧</option>
              <option value="lb">左下</option>
              <option value="bottom">底部</option>
              <option value="rb">右下</option>
            </select>
          </section>

          <section class="inspector-section naming-section">
            <h2>文件命名</h2>
            <label class="field" for="material-name-input">
              <span class="label">素材名称</span>
              <input
                id="material-name-input"
                type="text"
                maxlength="120"
                autocomplete="off"
                spellcheck="false"
                placeholder="请输入素材名称"
              />
            </label>
            <div class="naming-reference compact-naming-preview">
              <span class="label">导出预览</span>
              <span class="naming-value export-name-preview" id="export-name-preview">—</span>
            </div>
            <details class="source-name-details">
              <summary>查看原始文件名</summary>
              <span class="naming-value" id="original-file-name">—</span>
            </details>
            <div class="naming-message" id="naming-message">原始文件不会被修改 · F2 快速编辑</div>
          </section>

          <div class="native-hidden" id="image-settings">
            <select id="image-format">
              <option value="png" selected>PNG</option>
            </select>
          </div>

          <details class="inspector-section advanced-section hide" id="video-settings">
            <summary class="advanced-summary">
              <span>视频优化</span>
              <span class="summary-status-group">
                <span id="black-border-status" data-status="not_run">尚未检测</span>
                <span id="black-border-confidence"></span>
              </span>
            </summary>
            <div class="advanced-section-body">
              <div class="black-border-controls">
                <label class="toggle-row" for="auto-detect-black-borders">
                  <input id="auto-detect-black-borders" type="checkbox" checked />
                  <span>导入后自动检测黑边</span>
                </label>
                <div class="detection-actions">
                  <button id="detect-black-borders-current" type="button" class="ghost-button" disabled>检测当前</button>
                  <button id="detect-black-borders-all" type="button" class="ghost-button" disabled>检测全部</button>
                </div>
                <div class="detection-detail" id="black-border-detail">将从多个时间点采样并自动应用可靠结果。</div>
              </div>
              <div class="settings-grid">
                <div class="field">
                  <span class="label">输出片段</span>
                  <div class="static-value" id="video-range-summary">请在中间时间轴选择</div>
                </div>
              </div>
            </div>
          </details>

          <section class="inspector-section export-progress-section hide" id="export-progress-section">
            <div class="panel-head">
              <h2>处理进度</h2>
              <span id="progress-percent">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">等待导出...</div>
          </section>

          <section class="inspector-section compact-log-section">
            <details class="log-details">
              <summary>执行日志</summary>
              <pre id="log-output">等待操作...</pre>
            </details>
          </section>

          <div class="sticky-export-bar">
            <div class="footer-export-actions dual-actions">
              <button id="batch-export-button" type="button" class="ghost-button" disabled>批量导出</button>
              <button id="export-button" type="button" disabled>导出当前图片</button>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <div class="update-overlay hide" id="update-overlay" role="dialog" aria-modal="true" aria-labelledby="update-title">
      <section class="update-card">
        <div class="update-card-head">
          <div>
            <span class="update-eyebrow" id="update-status">发现新版本</span>
            <h2 id="update-title">应用更新</h2>
          </div>
          <span class="update-version" id="update-version">—</span>
        </div>
        <div class="update-notes" id="update-notes">此版本包含功能优化与稳定性改进。</div>
        <div class="update-progress-shell hide" id="update-progress-shell">
          <div class="update-progress-track">
            <div class="update-progress-fill" id="update-progress-fill"></div>
          </div>
          <span id="update-progress-text">正在准备下载…</span>
        </div>
        <div class="update-error hide" id="update-error"></div>
        <div class="update-actions">
          <button id="update-later-button" type="button" class="ghost-button">稍后</button>
          <button id="update-install-button" type="button">立即更新</button>
        </div>
      </section>
    </div>
  </body>
</html>
